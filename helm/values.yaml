annotations:
  reloader.stakater.com/auto: "true"

service:
  port: 80
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx-internal
    external-dns.alpha.kubernetes.io/hostname: grafana.crt.house
  ingressClassName: nginx-internal
  path: /
  pathType: Prefix
  hosts:
    - grafana.crt.house
  tls:
    - hosts:
        - grafana.crt.house

persistence:
  type: pvc
  enabled: true
  storageClassName: longhorn
  accessModes:
    - ReadWriteMany

admin:
  existingSecret: "grafana"

envValueFrom:
  INFLUX_TOKEN:
    secretKeyRef:
      name: influxdb-auth
      key: admin-token

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: influxdb2
      type: influxdb
      access: proxy
      url: http://influxdb2.influxdb2.svc:8086
      jsonData:
        defaultBucket: telegraf
        organization: influxdata
        tlsSkipVerify: true
        version: Flux
      secureJsonData:
        token: $INFLUX_TOKEN
    - name: loki
      type: loki
      access: proxy
      url: http://loki.loki.svc:3100
      jsonData:
        tlsSkipVerify: true
    - name: prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-server.prometheus.svc
      jsonData:
        httpMethod: POST
        manageAlerts: true
        prometheusType: Prometheus
        prometheusVersion: 2.55.0
        cacheLevel: 'High'
        disableRecordingRules: false
        incrementalQueryOverlapWindow: 10m

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
    provider:
      name: sidecar
      disableDelete: false
      allowUiUpdates: true
      foldersFromFilesStructure: false

namespaceOverride: "grafana"

plugins:
